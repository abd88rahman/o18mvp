name: o18mvp

services:
  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      # bind mount native (bukan named volume Docker) - sengaja, supaya
      # folder data database kelihatan langsung di file manager server.
      # Lihat notes/human-notes/master-plan.txt.
      - ./pgdata:/var/lib/postgresql/data

  odoo18-erp:
    image: odoo:18
    depends_on:
      - db
    environment:
      - HOST=db
      - USER=${POSTGRES_USER}
      - PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ../base:/mnt/extra-addons/base
      - ../mvp:/mnt/extra-addons/mvp
      - ../custom:/mnt/extra-addons/custom
      - ./etc:/etc/odoo
    # Port di-expose langsung juga (di luar nginx) buat kemudahan development
    # lokal (akses langsung http://localhost:8069/odoo tanpa lewat proxy).
    # Untuk production, cukup lewat nginx (port 80/443) - port ini bisa
    # dihapus/dibatasi ke localhost saja.
    ports:
      - "8069:8069"
      - "8072:8072"

  nginx:
    # profile "proxy" - tidak ikut start otomatis di "docker compose up -d".
    # Aktifkan manual saat nginx sudah siap dipakai:
    #   docker compose --profile proxy up -d
    profiles:
      - proxy
    image: nginx:stable
    depends_on:
      - odoo18-erp
    volumes:
      - ./nginx/odoo-erp.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
