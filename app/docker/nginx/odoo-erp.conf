# Draft konfigurasi nginx reverse proxy untuk Odoo 18, dengan URL backend
# /odoo/... ditampilkan sebagai /erp/... di address bar browser.
#
# Latar belakang & keputusan lengkap ada di:
# erd/base/03-url-rewrite.md
#
# Nama service "odoo18-erp" sudah cocok dengan docker-compose.yml di folder
# app/docker/ ini - tidak perlu diganti kalau nama service Odoo tidak diubah.
#
# TODO sebelum dipakai di production:
# - Ganti "erp.contoh.local" dengan domain/hostname sebenarnya.
# - Tambahkan blok SSL (listen 443 ssl; ssl_certificate ...) kalau pakai HTTPS
#   (sangat disarankan untuk production, tidak disertakan di draft ini).

upstream odoo18_backend {
    # nama service di docker-compose.yml, port default Odoo (http)
    server odoo18-erp:8069;
}

upstream odoo18_longpolling {
    # port longpolling/websocket Odoo (dipakai Discuss/chat realtime)
    server odoo18-erp:8072;
}

server {
    listen 80;
    server_name erp.contoh.local;

    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;

    # header standar supaya Odoo tahu request asli dari HTTPS/host mana
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;

    # --- Websocket / longpolling (Discuss realtime) ---
    # path ini TIDAK ikut rewrite /erp -> /odoo, dipakai apa adanya oleh JS
    location /websocket {
        proxy_pass http://odoo18_longpolling;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # --- Inti rewrite: /erp/... -> diteruskan ke backend sebagai /odoo/... ---
    location /erp {
        rewrite ^/erp(/.*)?$ /odoo$1 break;
        proxy_pass http://odoo18_backend;

        # WAJIB: tanpa ini, redirect internal Odoo (login, logout, database
        # manager - lihat detail di 03-url-rewrite.md) akan menulis ulang
        # address bar balik ke /odoo/... karena Location header dari Odoo
        # masih berisi path relatif /odoo/...
        proxy_redirect /odoo/ /erp/;
        proxy_redirect /odoo /erp;
    }

    # --- Semua path lain (asset statis /web/..., RPC /web/dataset/..., dsb) ---
    # SENGAJA tidak di-rewrite: path-path ini dipanggil oleh JS/AJAX internal,
    # bukan yang tampil di address bar, jadi tidak masalah tetap /web/...
    location / {
        proxy_pass http://odoo18_backend;
    }
}
